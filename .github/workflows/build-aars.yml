name: Build media3 AARs (LMG fork)

# Собирает пропатченный media3 в maven-репозиторий (AAR + POM с транзитивными
# зависимостями) и публикует его zip-ом в GitHub Release. Приложение LMG
# потребляет этот релиз (см. README).

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read version from catalog
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("gradle/libs.versions.toml").read_text())["versions"]["releaseVersion"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RELEASE_VERSION={version}\n")
          PYTHON

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform 36, build-tools 36)
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run crossfade unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :lib-exoplayer:testDebugUnitTest \
            --tests 'androidx.media3.exoplayer.PlayerAudioFadeControlCurvesTest' \
            --tests 'androidx.media3.exoplayer.CrossfadeConfigurationTest' \
            --tests 'androidx.media3.exoplayer.CrossfadeTrackRoutingTest' \
            --tests 'androidx.media3.exoplayer.MediaPeriodQueueTest' \
            --tests 'androidx.media3.exoplayer.ExoPlayerCrossfadeTest' \
            --tests 'androidx.media3.exoplayer.DefaultMediaClockTest' \
            --tests 'androidx.media3.exoplayer.ExoPlayerTest.renderersLifecycle*'

      - name: Publish media3 AARs to local maven repo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -PmavenRepo=$GITHUB_WORKSPACE/m2 \
            :lib-common:publishReleasePublicationToMavenRepository \
            :lib-common-ktx:publishReleasePublicationToMavenRepository \
            :lib-container:publishReleasePublicationToMavenRepository \
            :lib-database:publishReleasePublicationToMavenRepository \
            :lib-datasource:publishReleasePublicationToMavenRepository \
            :lib-decoder:publishReleasePublicationToMavenRepository \
            :lib-extractor:publishReleasePublicationToMavenRepository \
            :lib-exoplayer:publishReleasePublicationToMavenRepository \
            :lib-exoplayer-hls:publishReleasePublicationToMavenRepository \
            :lib-session:publishReleasePublicationToMavenRepository \
            :lib-ui:publishReleasePublicationToMavenRepository

      - name: Show produced artifacts
        run: |
          echo "== m2 tree =="
          find m2 -name "*.aar" -o -name "*.pom" | sort

      - name: Zip maven repo
        run: |
          cd m2 && zip -qr ../media3-${RELEASE_VERSION}-m2.zip . && cd ..
          ls -la media3-${RELEASE_VERSION}-m2.zip

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: media3-${{ env.RELEASE_VERSION }}-m2
          path: media3-${{ env.RELEASE_VERSION }}-m2.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && !endsWith(env.RELEASE_VERSION, '-SNAPSHOT')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its published assets unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            "media3-${RELEASE_VERSION}-m2.zip" \
            --title "media3 $RELEASE_VERSION (LMG fork)" \
            --notes "Пропатченный media3 для LiquidMusicGlass (crossfade). Maven-репозиторий (AAR+POM) в zip. Потребляется приложением LMG."
