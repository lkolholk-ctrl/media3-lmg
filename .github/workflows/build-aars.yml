name: Build media3 AARs (LMG fork)

# Собирает пропатченный media3 в maven-репозиторий (AAR + POM с транзитивными
# зависимостями) и публикует его zip-ом в GitHub Release. Приложение LMG
# потребляет этот релиз (см. README).

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Версия форка. Бампать при каждом изменении патча (…-lmg1, -lmg2, …).
  RELEASE_VERSION: 1.5.1-lmg5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform 35, build-tools 35)
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Publish media3 AARs to local maven repo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -PmavenRepo=$GITHUB_WORKSPACE/m2 \
            -PreleaseVersion=$RELEASE_VERSION \
            :lib-common:publishReleasePublicationToMavenRepository \
            :lib-common-ktx:publishReleasePublicationToMavenRepository \
            :lib-container:publishReleasePublicationToMavenRepository \
            :lib-database:publishReleasePublicationToMavenRepository \
            :lib-datasource:publishReleasePublicationToMavenRepository \
            :lib-decoder:publishReleasePublicationToMavenRepository \
            :lib-extractor:publishReleasePublicationToMavenRepository \
            :lib-exoplayer:publishReleasePublicationToMavenRepository \
            :lib-exoplayer-hls:publishReleasePublicationToMavenRepository \
            :lib-session:publishReleasePublicationToMavenRepository \
            :lib-ui:publishReleasePublicationToMavenRepository

      - name: Show produced artifacts
        run: |
          echo "== m2 tree =="
          find m2 -name "*.aar" -o -name "*.pom" | sort

      - name: Zip maven repo
        run: |
          cd m2 && zip -qr ../media3-${RELEASE_VERSION}-m2.zip . && cd ..
          ls -la media3-${RELEASE_VERSION}-m2.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${RELEASE_VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "media3-${RELEASE_VERSION}-m2.zip" \
            --title "media3 $RELEASE_VERSION (LMG fork)" \
            --notes "Пропатченный media3 для LiquidMusicGlass (crossfade). Maven-репозиторий (AAR+POM) в zip. Потребляется приложением LMG."
